[package]
name = "astrcode-ext-weneed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AstrCode 插件：在 DeepSeek 模型上注入「we need」思维链引导规范"

[[bin]]
name = "astrcode-ext-weneed"
path = "src/main.rs"

[dependencies]
astrcode-extension-worker.workspace = true
# `hostpaths`：插件数据目录与原子写。磁盘扩展拿不到进程内的 `ExtensionPaths`，
# 只能按宿主同一套布局自己拼路径。
astrcode-extension-sdk.workspace = true
# 共享的配置读写生命周期（`common::config::ConfigStore`）与插件数据目录布局。
astrcode-ext-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# `testing` feature 只用于测试，不进入生产依赖：它暴露 HostApi 注入缝隙。
astrcode-extension-worker = { workspace = true, features = ["testing"] }
async-trait.workspace = true

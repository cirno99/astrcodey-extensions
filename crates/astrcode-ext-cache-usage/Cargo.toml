[package]
name = "astrcode-ext-cache-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AstrCode 插件：查看当前会话的 prompt 缓存命中率"

[[bin]]
name = "astrcode-ext-cache-usage"
path = "src/main.rs"

[dependencies]
astrcode-extension-worker.workspace = true
astrcode-ext-common.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# `testing` feature 只用于测试，不进入生产依赖：它暴露 HostApi 注入缝隙。
astrcode-extension-worker = { workspace = true, features = ["testing"] }
async-trait.workspace = true